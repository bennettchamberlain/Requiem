<title>Maia · Connect accounts</title>
<body style="font:16px/1.4 system-ui;max-width:40rem;margin:3rem auto;padding:0 1rem">
  <h1>Connect accounts</h1>
  <p>Sign in with One, then connect any app One supports. Slack, Linear, Gmail, and the rest are separate accounts. Disconnecting one does not drop the others.</p>
  <p>From <code>connect/</code>, run <code>one connect create</code> and approve Maia. Put the client secret and connect key in <code>.env</code>.</p>
</body>
